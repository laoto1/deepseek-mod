name: Build Modded DeepSeek APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK URL (optional — leave empty to auto-scrape APKMirror)'
        required: false
  schedule:
    - cron: '0 6 * * *'  # Daily at 6AM UTC (1PM Vietnam)
  push:
    paths:
      - 'mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Download Tools
        run: |
          mkdir -p tools
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -O tools/apktool.jar
          wget -q https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar \
            -O tools/baksmali.jar

      - name: Get APK
        id: get_apk
        run: |
          mkdir -p work
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "Downloading from provided URL..."
            wget -q "${{ inputs.apk_url }}" -O work/deepseek-original.apk
            echo "version=manual" >> $GITHUB_OUTPUT
          else
            echo "Auto-scraping APKMirror..."
            python3 mod/scrape_apkmirror.py --output work/deepseek-original.apk
            VERSION=$(python3 mod/scrape_apkmirror.py --version-only 2>/dev/null | tail -1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Check if already built
        id: check_existing
        run: |
          VERSION="${{ steps.get_apk.outputs.version }}"
          if gh release view "mod-v${VERSION}" &>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already built, skipping..."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Decompile APK
        if: steps.check_existing.outputs.skip != 'true'
        run: java -jar tools/apktool.jar d work/deepseek-original.apk -o work/decompiled -f

      - name: Auto-detect & Patch
        if: steps.check_existing.outputs.skip != 'true'
        run: python3 mod/patcher.py work/decompiled --mod-dir mod --verbose

      - name: Compile OverlayManager
        if: steps.check_existing.outputs.skip != 'true'
        run: |
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p work/classes work/dex work/smali_overlay

          javac -source 8 -target 8 \
            -bootclasspath $ANDROID_JAR \
            -classpath $ANDROID_JAR \
            -d work/classes \
            mod/java/OverlayManager.java

          find work/classes -name "*.class" | xargs \
            d8 --output work/dex --lib $ANDROID_JAR

          java -jar tools/baksmali.jar d work/dex/classes.dex -o work/smali_overlay

          cp work/smali_overlay/com/deepseek/chat/mod/OverlayManager*.smali \
            work/decompiled/smali/com/deepseek/chat/mod/

          echo "Copied $(ls work/smali_overlay/com/deepseek/chat/mod/OverlayManager*.smali | wc -l) OverlayManager smali files"

      - name: Rebuild & Sign APK
        if: steps.check_existing.outputs.skip != 'true'
        run: |
          java -jar tools/apktool.jar b work/decompiled -o work/unsigned.apk -f

          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > work/mod.jks

          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 work/unsigned.apk work/aligned.apk

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks work/mod.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --out deepseek-mod.apk work/aligned.apk

          rm -f work/mod.jks

      - name: Get APK Info
        if: steps.check_existing.outputs.skip != 'true'
        id: apk_info
        run: |
          INFO=$(aapt2 dump badging deepseek-mod.apk)
          VERSION=$(echo "$INFO" | grep -oP "versionName='\K[^']+")
          VCODE=$(echo "$INFO" | grep -oP "versionCode='\K[^']+")
          SIZE=$(du -h deepseek-mod.apk | cut -f1)
          SHA=$(sha256sum deepseek-mod.apk | cut -d' ' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Upload Release
        if: steps.check_existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "mod-v${{ steps.apk_info.outputs.version }}"
          name: "DeepSeek Mod v${{ steps.apk_info.outputs.version }}"
          files: deepseek-mod.apk
          body: |
            ## DeepSeek Modded APK — Laoto Edition

            | Info | Value |
            |------|-------|
            | **Version** | ${{ steps.apk_info.outputs.version }} |
            | **Version Code** | ${{ steps.apk_info.outputs.vcode }} |
            | **Size** | ${{ steps.apk_info.outputs.size }} |
            | **SHA256** | `${{ steps.apk_info.outputs.sha256 }}` |

            ### Features
            - ✅ Laoto Overlay (glassmorphism floating bubble)
            - ✅ Chat History Browser (full markdown rendering)
            - ✅ Anti-Censorship (SSE buffer capture)
            - ✅ NSFW Prompt Menu (GitHub-synced)
            - ✅ Auto-Permission Request (Storage + Overlay)
            - ✅ Multi-arch: arm64-v8a, armeabi-v7a, x86, x86_64

      - name: Upload Artifact
        if: steps.check_existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-mod-apk
          path: deepseek-mod.apk
